asyncapi: 2.6.0
info:
  title: AI Todo Event-Driven Backbone
  version: 1.0.0
  description: |
    AsyncAPI specification for all events in the AI Todo event-driven architecture.
    Events are published to Kafka topics via Dapr Pub/Sub component.
  contact:
    name: AI Todo Team
    email: support@ai-todo.local

servers:
  kafka:
    url: ai-todo-kafka-kafka-bootstrap.default.svc.cluster.local:9092
    protocol: kafka
    description: Local Kafka cluster managed by Strimzi Operator

channels:
  todo.task.events:
    description: Task lifecycle events (created, updated, completed, deleted)
    subscribe:
      summary: Subscribe to task events
      operationId: onTaskEvent
      message:
        oneOf:
          - $ref: '#/components/messages/TaskCreated'
          - $ref: '#/components/messages/TaskUpdated'
          - $ref: '#/components/messages/TaskCompleted'
          - $ref: '#/components/messages/TaskDeleted'

  todo.reminders:
    description: Reminder scheduling events
    subscribe:
      summary: Subscribe to reminder events
      operationId: onReminderEvent
      message:
        $ref: '#/components/messages/ReminderScheduled'

  todo.notifications:
    description: Notification delivery events
    subscribe:
      summary: Subscribe to notification events
      operationId: onNotificationEvent
      message:
        $ref: '#/components/messages/NotificationSent'

  todo.audit.events:
    description: System audit events for observability
    subscribe:
      summary: Subscribe to audit events
      operationId: onAuditEvent
      message:
        $ref: '#/components/messages/AuditLogged'

components:
  messages:
    TaskCreated:
      name: task.created
      title: Task Created Event
      summary: Published when a new task is created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TaskCreatedPayload'

    TaskUpdated:
      name: task.updated
      title: Task Updated Event
      summary: Published when task properties are modified
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TaskUpdatedPayload'

    TaskCompleted:
      name: task.completed
      title: Task Completed Event
      summary: Published when a task is marked as completed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TaskCompletedPayload'

    TaskDeleted:
      name: task.deleted
      title: Task Deleted Event
      summary: Published when a task is permanently deleted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TaskDeletedPayload'

    ReminderScheduled:
      name: reminder.scheduled
      title: Reminder Scheduled Event
      summary: Published when a reminder is scheduled via Dapr Jobs API
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReminderScheduledPayload'

    NotificationSent:
      name: notification.sent
      title: Notification Sent Event
      summary: Published when Notification Service processes a reminder
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationSentPayload'

    AuditLogged:
      name: audit.logged
      title: Audit Logged Event
      summary: Published when Audit Service persists a system event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuditLoggedPayload'

  schemas:
    BaseEvent:
      type: object
      required:
        - event_type
        - payload
        - user_id
        - timestamp
        - correlation_id
      properties:
        event_type:
          type: string
          description: Type of event
        payload:
          type: object
          description: Event-specific data
        user_id:
          type: string
          format: uuid
          description: User who triggered the event
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of event occurrence
        correlation_id:
          type: string
          format: uuid
          description: Unique identifier for tracing related events

    TaskCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [task.created]
            payload:
              type: object
              required:
                - task_id
                - title
                - status
                - priority
                - is_recurring
                - created_at
              properties:
                task_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [pending, in_progress, completed]
                priority:
                  type: string
                  enum: [low, medium, high]
                due_date:
                  type: string
                  format: date-time
                  nullable: true
                is_recurring:
                  type: boolean
                recurrence_pattern:
                  type: string
                  enum: [daily, weekly, monthly]
                  nullable: true
                recurrence_interval:
                  type: integer
                  minimum: 1
                  nullable: true
                recurrence_day_of_week:
                  type: integer
                  minimum: 0
                  maximum: 6
                  nullable: true
                recurrence_day_of_month:
                  type: integer
                  minimum: 1
                  maximum: 31
                  nullable: true
                parent_task_id:
                  type: string
                  format: uuid
                  nullable: true
                tags:
                  type: array
                  items:
                    type: string
                created_at:
                  type: string
                  format: date-time

    TaskUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [task.updated]
            payload:
              type: object
              required:
                - task_id
                - changes
                - updated_at
              properties:
                task_id:
                  type: string
                  format: uuid
                changes:
                  type: object
                  properties:
                    title:
                      type: string
                      nullable: true
                    description:
                      type: string
                      nullable: true
                    status:
                      type: string
                      enum: [pending, in_progress, completed]
                      nullable: true
                    priority:
                      type: string
                      enum: [low, medium, high]
                      nullable: true
                    due_date:
                      type: string
                      format: date-time
                      nullable: true
                    tags:
                      type: array
                      items:
                        type: string
                      nullable: true
                updated_at:
                  type: string
                  format: date-time

    TaskCompletedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [task.completed]
            payload:
              type: object
              required:
                - task_id
                - title
                - is_recurring
                - completed_at
              properties:
                task_id:
                  type: string
                  format: uuid
                title:
                  type: string
                is_recurring:
                  type: boolean
                recurrence_pattern:
                  type: string
                  enum: [daily, weekly, monthly]
                  nullable: true
                recurrence_interval:
                  type: integer
                  minimum: 1
                  nullable: true
                recurrence_day_of_week:
                  type: integer
                  minimum: 0
                  maximum: 6
                  nullable: true
                recurrence_day_of_month:
                  type: integer
                  minimum: 1
                  maximum: 31
                  nullable: true
                completed_at:
                  type: string
                  format: date-time

    TaskDeletedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [task.deleted]
            payload:
              type: object
              required:
                - task_id
                - title
                - deleted_at
              properties:
                task_id:
                  type: string
                  format: uuid
                title:
                  type: string
                deleted_at:
                  type: string
                  format: date-time

    ReminderScheduledPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [reminder.scheduled]
            payload:
              type: object
              required:
                - reminder_id
                - task_id
                - task_title
                - scheduled_time
                - message
                - job_name
              properties:
                reminder_id:
                  type: string
                  format: uuid
                task_id:
                  type: string
                  format: uuid
                task_title:
                  type: string
                scheduled_time:
                  type: string
                  format: date-time
                message:
                  type: string
                job_name:
                  type: string
                  description: Dapr Job identifier

    NotificationSentPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [notification.sent]
            payload:
              type: object
              required:
                - notification_id
                - task_id
                - task_title
                - message
                - sent_at
                - delivery_status
              properties:
                notification_id:
                  type: string
                  format: uuid
                task_id:
                  type: string
                  format: uuid
                task_title:
                  type: string
                message:
                  type: string
                sent_at:
                  type: string
                  format: date-time
                delivery_status:
                  type: string
                  enum: [success, failed]

    AuditLoggedPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          properties:
            event_type:
              type: string
              enum: [audit.logged]
            payload:
              type: object
              required:
                - audit_id
                - original_event_type
                - original_event_payload
                - service_name
                - logged_at
              properties:
                audit_id:
                  type: string
                  format: uuid
                original_event_type:
                  type: string
                original_event_payload:
                  type: object
                service_name:
                  type: string
                logged_at:
                  type: string
                  format: date-time
