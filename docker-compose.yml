# Docker Compose for Local Testing
# Generated by Claude Code following Gordon contract specifications
# Purpose: Test containerized application locally before Kubernetes deployment

version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-todo-frontend:v1.0.0
    container_name: ai-todo-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8001
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_DEBUG=true
      - NEXT_PUBLIC_VERBOSE_LOGGING=true
    depends_on:
      - backend
    networks:
      - ai-todo-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-todo-backend:v1.0.0
    container_name: ai-todo-backend
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - LOG_LEVEL=info
      - DEBUG=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - ENABLE_RATE_LIMITING=false
      - RATE_LIMIT_PER_MINUTE=100
      - JWT_EXPIRATION_DELTA_MINUTES=30
      - GROQ_MODEL=llama-3.3-70b-versatile
      # Secrets - load from .env file or set manually
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - ai-todo-network
    restart: unless-stopped

networks:
  ai-todo-network:
    driver: bridge

# Note: Create a .env file in the root directory with the following secrets:
# DATABASE_URL=postgresql+asyncpg://user:password@host:port/database
# BETTER_AUTH_SECRET=your-better-auth-secret-key-here
# JWT_SECRET=your-jwt-secret-key-here
# GROQ_API_KEY=your-groq-api-key-here
