apiVersion: v1
kind: Service
metadata:
  name: {{ include "zipkin.fullname" . }}
  labels:
    app: zipkin
    {{- include "zipkin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: zipkin
