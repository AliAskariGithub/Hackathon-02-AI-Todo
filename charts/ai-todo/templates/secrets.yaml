apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-todo.fullname" . }}-secrets
  labels:
    {{- include "ai-todo.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database Configuration
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}

  # Authentication Secrets
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # External API Keys
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
