apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-todo.fullname" . }}-config
  labels:
    {{- include "ai-todo.labels" . | nindent 4 }}
data:
  # Shared Configuration
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  ENABLE_RATE_LIMITING: {{ .Values.config.enableRateLimiting | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}

  # Frontend Configuration
  NEXT_PUBLIC_API_BASE_URL: "http://backend-service:8001"
  NEXT_PUBLIC_SITE_URL: {{ .Values.config.siteUrl | quote }}
  NEXT_PUBLIC_BETTER_AUTH_URL: {{ .Values.config.siteUrl | quote }}
  NEXT_PUBLIC_DEBUG: {{ .Values.config.debug | quote }}
  NEXT_PUBLIC_VERBOSE_LOGGING: {{ .Values.config.debug | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-todo.fullname" . }}-backend-config
  labels:
    {{- include "ai-todo.labels" . | nindent 4 }}
data:
  # Backend-specific Configuration
  HOST: "0.0.0.0"
  PORT: "8001"
  JWT_EXPIRATION_DELTA_MINUTES: "30"
  GROQ_MODEL: "llama-3.3-70b-versatile"
