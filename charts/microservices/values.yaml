# Microservices Configuration for AI Todo Event-Driven Architecture

# Notification Service Configuration
notification:
  name: notification-service
  replicas: 1

  # Container image configuration
  image:
    repository: ai-todo/notification-service
    tag: v1.0.3
    pullPolicy: IfNotPresent

  # Service port
  port: 8004

  # Kubernetes Service configuration
  service:
    port: 8004

  # Dapr configuration
  dapr:
    appId: notification-service
    config: tracing-config
    logLevel: info
    pubsubName: kafka-pubsub
    stateStore: statestore

  # Resource limits
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

